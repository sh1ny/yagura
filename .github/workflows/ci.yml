name: CI

# Actions minutes are limited (private repository, Windows bills double), so
# CI runs on pull requests and on demand (`gh workflow run ci.yml --ref <ref>`),
# not on every push.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in mise.toml
        uses: jdx/mise-action@v5
      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && format('{0}\Pub\Cache', env.LOCALAPPDATA) || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Format check
        run: mise run format:check
      - name: Analyze
        run: mise run analyze
      - name: Test
        run: mise run test

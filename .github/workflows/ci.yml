name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain pinned in mise.toml
        uses: jdx/mise-action@v5
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Format check
        run: mise run format:check
      - name: Analyze
        run: mise run analyze
      - name: Test
        run: mise run test

syntax = "proto3";

package garrison.v1;

import "google/protobuf/timestamp.proto";
import "garrison/v1/operations.proto";

service Mods {
  rpc ListMods(ListModsRequest) returns (ListModsResponse);
  // Records changes; staging happens on next start or ApplyMods.
  rpc SetMods(SetModsRequest) returns (ListModsResponse);
  rpc ApplyMods(ApplyModsRequest) returns (Operation);
  rpc CheckModUpdates(CheckModUpdatesRequest) returns (Operation);
  rpc UpdateMods(UpdateModsRequest) returns (Operation);
}

message Mod {
  string source = 1;                  // steam_workshop | url_archive | server_managed
  string item_id = 2;
  string name = 3;
  string role = 4;                    // one of the plugin's roles
  uint32 position = 5;                // load order within role
  string status = 6;                  // pending | staged | downloading | failed | unavailable
  string staged_name = 7;             // e.g. "@Community-Framework", fixed when added
  string desired_version = 13;        // version the next staging will link
  string staged_version = 14;         // version the instance's junction points at now
  uint64 size_bytes = 8;
  google.protobuf.Timestamp local_updated = 9;
  google.protobuf.Timestamp remote_updated = 10;
  bool update_available = 11;
  string last_error = 12;
}

message ListModsRequest {
  string instance_id = 1;
}

message ListModsResponse {
  repeated Mod mods = 1;
  string update_check = 2;            // ok | unknown
  google.protobuf.Timestamp checked_at = 3;
}

message ModRef {
  string source = 1;
  string item_id = 2;
  string role = 3;
}

message SetModsRequest {
  string instance_id = 1;
  uint64 expected_revision = 3;
  repeated ModRef mods = 2;           // full ordered list (order = load order per role)
}

message ApplyModsRequest {
  string instance_id = 1;
}

message CheckModUpdatesRequest {
  string instance_id = 1;             // empty = all instances
}

message UpdateModsRequest {
  string instance_id = 1;
  repeated string item_ids = 2;       // empty = all with update_available
}

syntax = "proto3";

package yagura.v1;

import "google/protobuf/timestamp.proto";

// Enroll and Info are the only methods that accept a connection without a
// client certificate (TLS server auth only; the client pins the CA
// fingerprint from the pairing string). Everything else requires mTLS with
// an enrolled, non-revoked device certificate (ADR 0007).
service Pairing {
  rpc Info(PairingInfoRequest) returns (PairingInfo);
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (Device);
  rpc RenameDevice(RenameDeviceRequest) returns (Device);
  // Over the caller's existing mTLS connection: signs a CSR for a new key,
  // adds a certificate row to the same device; the old one works until it expires.
  rpc RenewCertificate(RenewCertificateRequest) returns (EnrollResponse);
}

message PairingInfoRequest {}

message PairingInfo {
  string daemon_name = 1;
  string ca_fingerprint_sha256 = 2;
  string api_version = 3;
  bytes ca_certificate_der = 4;   // client checks SHA-256 == pairing-string pin, then uses it as the sole root
  string tls_authority = 5;       // "yagurad-<daemon-id>", the server certificate SAN
}

message EnrollRequest {
  string code = 1;          // single use, 10 min TTL
  string device_name = 2;   // 1-64 chars
  bytes csr_der = 3;        // PKCS#10, ECDSA P-256 key held in the client keychain
}

message EnrollResponse {
  string device_id = 1;
  bytes client_certificate_der = 2; // signed by the daemon CA, 1-year validity
  bytes ca_certificate_der = 3;
}

message Device {
  string id = 1;
  string name = 2;
  reserved 3;
  repeated DeviceCertificate certificates = 12; // current and previous; revocation covers all
  google.protobuf.Timestamp enrolled_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  string last_address = 6;
  google.protobuf.Timestamp certificate_expires_at = 7;
  bool revoked = 8;
  google.protobuf.Timestamp revoked_at = 9;
  string revoked_by_device_id = 10;
  bool is_caller = 11;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message RevokeDeviceRequest {
  string device_id = 1;
}

message RenameDeviceRequest {
  string device_id = 1;
  string name = 2;
}

message RenewCertificateRequest {
  bytes csr_der = 1;
}

message DeviceCertificate {
  string sha256 = 1;                // identity (dart:io exposes DER, not serial)
  google.protobuf.Timestamp not_after = 2;
}

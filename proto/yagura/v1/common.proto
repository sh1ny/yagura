syntax = "proto3";

package yagura.v1;

// Machine-readable error detail attached to every non-OK status
// (packed into google.rpc.Status.details). `reason` values are stable and
// listed in docs/protocol.md; a reason is never reused for another meaning.
message ErrorDetail {
  string reason = 1;
  string message = 2;
  repeated FieldViolation field_violations = 3;
  string incident_id = 4;           // set for INTERNAL errors
  map<string, string> metadata = 5; // e.g. conflicting_instance, port
}

message FieldViolation {
  string field = 1;       // JSON path, e.g. "itemStackOverrides[1].class"
  string description = 2; // constraint that failed
}

// Plugin-shaped data travels as JSON text with the version of the schema it
// was produced for (ADR 0006).
message JsonDocument {
  string json = 1;
  uint32 schema_version = 2;
}

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_UDP = 1;
  PROTOCOL_TCP = 2;
  PROTOCOL_BOTH = 3;
}

message Port {
  string name = 1;     // as declared by the plugin: game, query, rcon...
  uint32 number = 2;
  Protocol protocol = 3;
  string purpose = 4;  // game | query | rcon | web | other
  bool exposed = 5;    // firewall rule wanted
}



message Empty {}


syntax = "proto3";

package yagura.v1;

service Firewall {
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc Reconcile(ReconcileRequest) returns (ReconcileResponse);
}

message FirewallRule {
  string name = 1;                    // Yagura/<instance-id>/<port-name>/<proto>
  string instance_id = 2;
  string port_name = 3;
  uint32 port = 4;
  string protocol = 5;
  bool managed = 6;                   // false = in the group but not ours (unmanaged)
  bool present = 7;                   // exists in the OS firewall
  bool in_step = 8;                  // as the daemon wants it (port and protocol); false = missing, drifted, or to be deleted. `port` and `protocol` are the actual ones when the rule exists
}

message ListRulesRequest {}

message ListRulesResponse {
  repeated FirewallRule rules = 1;
  string status = 2;                  // ok | firewall_unavailable
}

message ReconcileRequest {}

message RuleChange {
  string name = 1;
  string action = 2;                  // created | updated | deleted | recreated | failed
  string error = 3;
}

message ReconcileResponse {
  repeated RuleChange changes = 1;
}

syntax = "proto3";

package yagura.v1;

import "google/protobuf/timestamp.proto";
import "yagura/v1/common.proto";
import "yagura/v1/operations.proto";

service Instances {
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc GetInstance(GetInstanceRequest) returns (Instance);
  // Snapshot of all instances, then deltas. Sends RESYNC_REQUIRED and a new
  // snapshot when the subscriber fell more than 1000 events behind.
  rpc WatchInstances(WatchInstancesRequest) returns (stream InstanceEvent);

  rpc CreateInstance(CreateInstanceRequest) returns (Instance);
  rpc UpdateSettings(UpdateSettingsRequest) returns (Instance);
  rpc SetSecret(SetSecretRequest) returns (Instance);
  rpc DeleteSecret(DeleteSecretRequest) returns (Instance);
  // Runs on the instance's queue; with delete_files: snapshot, marker, rows, directory.
  rpc DeleteInstance(DeleteInstanceRequest) returns (Operation);
  rpc ImportInstance(ImportInstanceRequest) returns (ImportInstanceResponse);
  rpc ExportInstance(ExportInstanceRequest) returns (ExportInstanceResponse);

  // Lifecycle: each returns immediately with an operation; follow it with
  // Operations.WatchOperation.
  rpc Install(LifecycleRequest) returns (Operation);
  rpc Update(LifecycleRequest) returns (Operation);
  rpc Validate(LifecycleRequest) returns (Operation);
  rpc Start(LifecycleRequest) returns (Operation);
  rpc Stop(LifecycleRequest) returns (Operation);
  rpc Restart(LifecycleRequest) returns (Operation);
  rpc ApplyConfig(LifecycleRequest) returns (Operation);
  // Clears error after settings were fixed or the crash cause addressed.
  rpc Acknowledge(LifecycleRequest) returns (Instance);
  rpc ListSnapshots(GetInstanceRequest) returns (ListSnapshotsResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (Operation);
  // pre_delete snapshots of deleted instances, kept 30 days.
  rpc ListOrphanSnapshots(ListOrphanSnapshotsRequest) returns (ListSnapshotsResponse);
}

enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  INSTANCE_STATE_NOT_INSTALLED = 1;
  INSTANCE_STATE_INSTALLING = 2;
  INSTANCE_STATE_STOPPED = 3;
  INSTANCE_STATE_STARTING = 4;
  INSTANCE_STATE_RUNNING = 5;
  INSTANCE_STATE_STOPPING = 6;
  INSTANCE_STATE_UPDATING = 7;
  INSTANCE_STATE_ERROR = 8;
}

enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_OK = 1;
  HEALTH_UNKNOWN = 2;      // start_timeout passed without the check passing
  HEALTH_FAILING = 3;
}

message Instance {
  string id = 1;
  string name = 2;
  string plugin_id = 3;
  string plugin_version = 4;
  string directory = 5;
  InstanceState state = 6;
  string state_reason = 7;            // e.g. crash_loop
  Health health = 8;
  repeated Port ports = 9;
  // Settings values; secrets appear as {"secret": true, "set": bool}.
  JsonDocument settings = 10;
  string steam_account_id = 11;
  string restart_policy = 12;         // never | on_crash
  string firewall_status = 13;        // ok | degraded | disabled
  string active_operation_id = 14;
  uint32 queued_operations = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp state_changed_at = 17;
  uint32 pid = 18;                    // 0 when not running
  // Incremented only on configuration changes (settings, ports, secrets, mods,
  // restart policy, autostart, Steam account, snapshot restore), never on state, health,
  // pid or queue changes. Mutating calls send expected_revision and
  // get FAILED_PRECONDITION revision_conflict when it is stale.
  uint64 revision = 19;
  bool restart_required = 20;         // settings changed since the running process started
  bool autostart = 21;                // start again after daemon/host restart if it was running
  bool settings_invalid = 22;         // running instance whose settings failed re-validation
  uint32 mods_update_available = 23;
  // true on deltas where settings did not change; fetch with GetInstance.
  bool settings_omitted = 24;
}

message ListInstancesRequest {}

message ListInstancesResponse {
  repeated Instance instances = 1;
}

message GetInstanceRequest {
  string instance_id = 1;
}

message WatchInstancesRequest {}

message InstanceEvent {
  oneof event {
    InstanceSnapshot snapshot = 1;
    Instance changed = 2;
    string removed_instance_id = 3;
    ResyncRequired resync_required = 4;
    InstanceNotice notice = 5;        // crashed, crash_loop, lost_while_daemon_down...
  }
}

message InstanceSnapshot {
  repeated Instance instances = 1;
}

message ResyncRequired {}

message InstanceNotice {
  string instance_id = 1;
  string kind = 2;                    // crashed | crash_loop | lost_while_daemon_down | install_interrupted | update_interrupted | autostarted | run_record_rejected | settings_invalid | instance_file_stale
  string message = 3;
  int32 exit_code = 4;
  repeated string last_log_lines = 5; // up to 50
  google.protobuf.Timestamp at = 6;
}

message CreateInstanceRequest {
  string plugin_id = 1;
  string name = 2;
  string directory = 3;               // empty = <data>/instances/<id>
  JsonDocument settings = 4;          // schema_version must match the plugin
  repeated Port ports = 5;            // overrides of plugin defaults by name
  string steam_account_id = 6;
}

message UpdateSettingsRequest {
  string instance_id = 1;
  uint64 expected_revision = 6;
  JsonDocument settings = 2;          // full non-secret settings document
  repeated Port ports = 3;
  // unset = unchanged; empty steam_account_id = unlink
  optional string restart_policy = 4;
  optional string steam_account_id = 5;
  optional bool autostart = 7;
}

message SetSecretRequest {
  string instance_id = 1;
  uint64 expected_revision = 4;
  string key = 2;                     // setting key of type secret, or "gslt"
  string value = 3;                   // write-only; never returned
}

message DeleteSecretRequest {
  string instance_id = 1;
  uint64 expected_revision = 3;
  string key = 2;
}

message DeleteInstanceRequest {
  string instance_id = 1;
  uint64 expected_revision = 4;
  bool delete_files = 2;               // snapshot of data_paths is taken first
  string confirm_name = 3;            // must equal the instance name when delete_files
}

message ImportInstanceRequest {
  string directory = 1;               // contains instance.json
  string name = 2;
}

message ImportInstanceResponse {
  Instance instance = 1;
  repeated string secrets_to_set = 2;
}

message ExportInstanceRequest {
  string instance_id = 1;
}

message ExportInstanceResponse {
  string instance_json = 1;           // same content as the instance's instance.json
}

message LifecycleRequest {
  string instance_id = 1;
  bool validate_files = 2;            // Install/Update: SteamCMD validate
  bool force = 3;                     // Stop: skip graceful step
  bool skip_snapshot = 4;             // Update: do not snapshot data_paths first
}

message Snapshot {
  string id = 1;
  string instance_id = 5;
  string instance_name = 6;
  string reason = 2;                  // pre_update | pre_delete | pre_restore
  google.protobuf.Timestamp created_at = 3;
  uint64 size_bytes = 4;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message RestoreSnapshotRequest {
  string instance_id = 1;
  string snapshot_id = 2;
  uint64 expected_revision = 3;
}

message ListOrphanSnapshotsRequest {}

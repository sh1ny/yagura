// DayZ server configuration, created by Yagura on the first start.
// Yagura writes hostname, password, passwordAdmin, maxPlayers and
// verifySignatures from the instance's settings; every other key is yours.

hostname = "Yagura DayZ";   // Server name
password = "";              // Password to connect to the server
passwordAdmin = "";         // Password to become a server admin

enableWhitelist = 0;        // Enable/disable whitelist (value 0-1)

maxPlayers = 60;            // Maximum amount of players

verifySignatures = 2;       // Verifies .pbos against .bisign files (only 2 is supported)
forceSameBuild = 1;         // Allow only clients with the same build as the server (value 0-1)

disableVoN = 0;             // Enable/disable voice over network (value 0-1)
vonCodecQuality = 20;       // Voice over network codec quality (values 0-30)

disable3rdPerson = 0;       // Toggles the 3rd person view for players (value 0-1)
disableCrosshair = 0;       // Toggles the cross-hair (value 0-1)

disablePersonalLight = 1;   // Disables personal light for all clients
lightingConfig = 0;         // 0 for brighter night setup, 1 for darker night setup

serverTime = "SystemTime";  // Initial in-game time ("SystemTime" or "YYYY/MM/DD/HH/MM")
serverTimeAcceleration = 12;       // Time multiplier for in-game time (value 0-24)
serverNightTimeAcceleration = 1;   // Night time multiplier (0.1-64), on top of serverTimeAcceleration
serverTimePersistent = 0;   // Save the server time between starts (value 0-1)

guaranteedUpdates = 1;      // Communication protocol (use only 1)

loginQueueConcurrentPlayers = 5;   // Players processed at once during login
loginQueueMaxPlayers = 500;        // Players that can wait in the login queue

instanceId = 1;             // Server instance id; names the storage folder of the persistence files

storageAutoFix = 1;         // Replace corrupted persistence files with empty ones (value 0-1)

class Missions
{
    class DayZ
    {
        template = "dayzOffline.chernarusplus"; // <MissionName>.<TerrainName>
    };
};

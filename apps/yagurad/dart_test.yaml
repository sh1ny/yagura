# Test directories: unit and in-process tests, plus OS-level integration tests.
paths: [test, integration_test]

# Tags used to select tests (`dart test --exclude-tags valheim`).
tags:
  # Needs Windows: job objects, suspended spawn, Win32 process control.
  # The first such test also builds yagurad and fake_server (cold on CI).
  windows:
    timeout: 4x
  # Runs the real Valheim dedicated server (minutes; ~2.1 GB through the real
  # SteamCMD unless YAGURA_VALHEIM_SERVER names an install). Skipped by
  # default; run it with `dart test --run-skipped -t valheim`.
  valheim:
    skip: "runs the real Valheim server; use --run-skipped -t valheim"
  # Needs an elevated Windows session: creates local accounts, installs the
  # service, writes ACLs and firewall rules. Skipped by default and never run
  # on a developer's desktop: the manual `elevated` workflow
  # (.github/workflows/elevated.yml) runs it with `--run-skipped -t elevated`.
  elevated:
    skip: "needs an elevated Windows session; use --run-skipped -t elevated"

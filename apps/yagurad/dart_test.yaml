# Tags used to select tests (`dart test --exclude-tags valheim`).
tags:
  # Needs Windows: job objects, suspended spawn, Win32 process control.
  # The first such test also builds yagurad and fake_server (cold on CI).
  windows:
    timeout: 4x
  # Runs the real Valheim dedicated server (minutes; ~2.1 GB through the real
  # SteamCMD unless YAGURA_VALHEIM_SERVER names an install). Skipped by
  # default; run it with `dart test --run-skipped -t valheim`.
  valheim:
    skip: "runs the real Valheim server; use --run-skipped -t valheim"

name: yagura_desktop
description: "Yagura desktop client: manages yagurad daemons over gRPC."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  fixnum: ^1.1.1
  flutter_secure_storage: ^11.2.0
  grpc: ^5.2.0
  pointycastle: ^4.0.0
  protobuf: ^6.1.0
  yagura_pki: ^0.1.0
  yagura_proto: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
